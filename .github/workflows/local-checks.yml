name: Local checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python scripts/check_local.py
      - name: Install pinned dbt runtime
        run: python -m pip install -r requirements-dbt-core.txt
      - name: Parse dbt project without warehouse access
        env:
          GRIDPULSE_PROJECT_ID: gridpulse-offline
          DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
        run: |
          dbt parse --project-dir dbt --profiles-dir dbt --target pilot
          dbt parse --project-dir dbt --profiles-dir dbt --target history
          dbt parse --project-dir dbt --profiles-dir dbt --target recovery
